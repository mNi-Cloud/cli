on:
  workflow_dispatch:
  push:
    tags: ["v*"]

name: Release mni-client binaries

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Binaries
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        goosarch:
          - "darwin/amd64"
          - "darwin/arm64"
          - "linux/amd64"
          - "windows/amd64"
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v2
        with:
          go-version: "1.22.4"
      - name: Get OS and arch info
        run: |
          GOOSARCH=${{matrix.goosarch}}
          GOOS=${GOOSARCH%/*}
          GOARCH=${GOOSARCH#*/}
          BINARY_NAME=mni-$GOOS-$GOARCH
          if [ $GOOS = "windows" ]; then BINARY_NAME=$BINARY_NAME.exe; fi
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV
          echo "GOOS=$GOOS" >> $GITHUB_ENV
          echo "GOARCH=$GOARCH" >> $GITHUB_ENV
      - name: Build
        env:
          GH_USERNAME: ${{secrets.GH_USERNAME}}
          GH_PAT: ${{secrets.GH_PAT}}
        run: |
          git config --global url."https://$GH_USERNAME:$GH_PAT@github.com/mNi-Cloud/backend".insteadOf "https://github.com/mNi-Cloud/backend"
          GOPRIVATE=github.com/mNi-Cloud go build -o "$BINARY_NAME" -v cmd/mni-client/main.go
      - name: upload files
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}
  upload:
    name: Create Release
    runs-on: "ubuntu-latest"
    needs: build
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v3
      - name: Caluculate hash
        run: |
          ls mni-*/* | xargs md5 > hashes
      - name: Release with Notes
        uses: softprops/action-gh-release@v1
        with:
          body_path: "hashes"
          files: "mni-*/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
